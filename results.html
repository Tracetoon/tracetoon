<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracetoon benchmark results</title>
<meta http-equiv="refresh" content="0; url=prbench.html#results">
<link rel="canonical" href="https://tracetoon.ai/prbench.html#results">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fffdf6; --fg:#1b1913; --muted:#5a5548; --line:#e4dccb; --card:#ffffff;
    --accent:#c2410c; --accent-fg:#ffffff; --pow:#ffd84a; --pow-fg:#1b1913; --teal:#0f8f80; --good:#15803d;
    --ink:#1b1913; --shadow:4px 4px 0 var(--ink);
    --num:"Lilita One","Comic Neue",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14130f; --fg:#f2ede0; --muted:#aaa392; --line:#38342b; --card:#1d1b16;
      --accent:#fb8a4c; --accent-fg:#14130f; --teal:#2dd4bf; --good:#4ade80; --ink:#000000;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14130f; --fg:#f2ede0; --muted:#aaa392; --line:#38342b; --card:#1d1b16;
    --accent:#fb8a4c; --accent-fg:#14130f; --teal:#2dd4bf; --good:#4ade80; --ink:#000000;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; }
  a { color:var(--accent); }
  img { max-width:100%; height:auto; display:block; }
  /* Same widths as the landing page: sections grow to 1600px, text stays near 70 characters a line. */
  .wrap { max-width:1600px; margin:0 auto; padding:0 clamp(16px,4vw,48px); }
  .display { font-family:Bangers,"Comic Neue",system-ui,sans-serif; letter-spacing:.03em; font-weight:400; }

  /* shared site header: identical on every page */
  :root { --sh-bg:#fffdf6; --sh-fg:#1b1913; --sh-ink:#1b1913; --sh-accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sh-bg:#14130f; --sh-fg:#f2ede0; --sh-ink:#000000; --sh-accent:#fb8a4c; } }
  :root[data-theme="dark"] { --sh-bg:#14130f; --sh-fg:#f2ede0; --sh-ink:#000000; --sh-accent:#fb8a4c; }
  .site-top { position:sticky; top:0; z-index:50; background:var(--sh-bg); border-bottom:2px solid var(--sh-ink); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .site-top .site-wrap { max-width:1600px; margin:0 auto; padding:0 clamp(16px,4vw,48px); display:flex; align-items:center; gap:1rem; height:58px; box-sizing:border-box; }
  .site-brand { display:flex; align-items:center; gap:.45rem; text-decoration:none; color:var(--sh-fg); }
  .site-brand img { width:36px; height:36px; display:block; }
  .site-brand .site-wordmark { height:30px; width:auto; display:block; }
  .site-top nav { margin-left:auto; display:flex; gap:1.1rem; }
  .site-top nav a { color:var(--sh-fg); text-decoration:none; font-weight:600; font-size:.95rem; }
  .site-top nav a:hover, .site-top nav a[aria-current="page"] { color:var(--sh-accent); }
  .site-top nav a.ext { display:inline-flex; align-items:center; gap:.2em; }
  .site-top nav a.ext svg { width:.8em; height:.8em; }
  .site-sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (max-width:720px) { .site-top nav a.opt { display:none; } .site-top nav { gap:.85rem; } .site-brand .site-wordmark { height:26px; } }
  @media (min-width:2200px) { html { font-size:18px; } body, .site-top { font-size:19px; } .wrap, .site-top .site-wrap { max-width:1840px; } }
  @media (min-width:3000px) { html { font-size:24px; } body, .site-top { font-size:25px; } .wrap, .site-top .site-wrap { max-width:2500px; } .site-top .site-wrap { height:76px; } .site-brand img { width:46px; height:46px; } .site-brand .site-wordmark { height:38px; } }

  .kicker { display:inline-block; font-family:Bangers,system-ui,sans-serif; letter-spacing:.06em; font-size:1rem; background:var(--pow); color:var(--pow-fg); border:2px solid var(--ink); padding:0 .55rem; transform:rotate(-1.5deg); margin-bottom:.6rem; }
  .comic-img { border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); border-radius:6px; background:#fff; }

  /* hero */
  .hero { padding:2.2rem 0 2.5rem; }
  .hero .wrap { display:grid; grid-template-columns:1fr 1.15fr; gap:clamp(2rem,4vw,4rem); align-items:center; }
  .hero h1 { font-size:clamp(2.6rem,6vw,4.6rem); line-height:.98; margin:0 0 .9rem; }
  .hero h1 em { font-style:normal; background:var(--pow); color:var(--pow-fg); padding:0 .18em; border:3px solid var(--ink); box-shadow:var(--shadow); display:inline-block; transform:rotate(-2deg); }
  .lede { font-size:1.12rem; color:var(--muted); margin:0 0 1rem; max-width:38em; }
  .lede strong { color:var(--fg); }
  @media (max-width:880px) { .hero .wrap { grid-template-columns:1fr; } .hero { padding-top:1.25rem; } }

  /* highlights */
  .highlights { padding:2.5rem 0; border-top:2px dashed var(--line); }
  .highlights h2, .reports h2 { font-size:clamp(2rem,4vw,2.8rem); line-height:1.02; margin:0 0 1rem; }
  .hl { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }
  @media (max-width:980px) { .hl { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:560px) { .hl { grid-template-columns:1fr; } }
  .hl li { background:var(--card); border:2px solid var(--ink); border-radius:8px; box-shadow:3px 3px 0 var(--ink); padding:.8rem 1rem; display:flex; flex-direction:column; gap:.3rem; }
  .hl b { font-family:var(--num); font-weight:400; font-size:clamp(1.8rem,2.6vw,2.3rem); line-height:1.05; color:var(--accent); letter-spacing:.01em; }
  .nw { white-space:nowrap; }
  .hl li > span { font-size:.9rem; line-height:1.4; }
  .hl small { font-size:.78rem; color:var(--muted); margin-top:auto; }

  /* report cards */
  .reports { padding:2.5rem 0 3rem; border-top:2px dashed var(--line); }
  .reports > .wrap > p { color:var(--muted); max-width:68ch; margin:0 0 1.5rem; }
  .report { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:clamp(1.5rem,3vw,3rem); align-items:center; padding:1.8rem 0; }
  .report + .report { border-top:2px solid var(--line); }
  .report:nth-of-type(even) .art { order:2; }
  .report .art a { display:block; transform:rotate(-.6deg); transition:transform .15s; }
  .report:nth-of-type(even) .art a { transform:rotate(.6deg); }
  .report .art a:hover { transform:rotate(0) scale(1.01); }
  .tag { display:inline-flex; gap:.5rem; flex-wrap:wrap; align-items:center; font-size:.82rem; font-weight:600; color:var(--muted); margin:0 0 .4rem; }
  .tag .new { background:var(--accent); color:var(--accent-fg); border:2px solid var(--ink); border-radius:4px; padding:0 .4rem; font-family:Bangers,system-ui,sans-serif; letter-spacing:.06em; font-weight:400; font-size:.95rem; }
  .report h3 { font-family:Bangers,"Comic Neue",system-ui,sans-serif; font-weight:400; letter-spacing:.03em; font-size:clamp(1.7rem,3vw,2.3rem); line-height:1.05; margin:0 0 .6rem; }
  .report h3 a { color:inherit; text-decoration:none; }
  .report h3 a:hover { color:var(--accent); }
  .report p { margin:0 0 .8rem; max-width:68ch; }
  .figs { list-style:none; padding:0; margin:.4rem 0 1rem; display:flex; flex-wrap:wrap; gap:.6rem; }
  .figs li { border-left:4px solid var(--accent); padding:.05rem .7rem .05rem .6rem; font-size:.84rem; color:var(--muted); line-height:1.3; max-width:15rem; }
  .figs b { display:block; font-family:var(--num); font-weight:400; font-size:1.55rem; color:var(--fg); line-height:1.1; letter-spacing:.01em; }
  .caveat { font-size:.88rem; color:var(--muted); background:var(--card); border:1.5px dashed var(--line); border-radius:6px; padding:.5rem .75rem; max-width:68ch; }
  .go { display:inline-block; font-weight:700; text-decoration:none; background:var(--pow); color:var(--pow-fg); border:2px solid var(--ink); border-radius:6px; padding:.35rem .9rem; box-shadow:3px 3px 0 var(--ink); }
  .go:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  @media (max-width:880px) { .report { grid-template-columns:1fr; } .report:nth-of-type(even) .art { order:0; } }

  /* how we test */
  .bench { padding:2.5rem 0 3rem; background:var(--pow); color:var(--pow-fg); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink); }
  .bench .wrap { display:grid; grid-template-columns:1.2fr 1fr; gap:2rem; align-items:center; }
  .bench h2 { font-size:clamp(2rem,4vw,2.8rem); line-height:1; margin:0 0 .5rem; }
  .bench p { margin:0 0 .7rem; max-width:62ch; }
  .bench ul { margin:0; padding-left:1.1rem; }
  .bench li { margin:.3rem 0; }
  .bench a { color:var(--pow-fg); font-weight:700; }
  @media (max-width:880px) { .bench .wrap { grid-template-columns:1fr; } }
  footer { padding:1.5rem 0 2.5rem; color:var(--muted); font-size:.88rem; }
  footer .wrap { display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; }
</style>
<script>location.replace('prbench.html#results');</script>
</head>
<body>
<header class="site-top">
  <div class="site-wrap">
    <a class="site-brand" href="./" aria-label="Tracetoon home">
      <img src="favicon.svg" alt="" width="36" height="36">
      <img class="site-wordmark" src="img/tracetoon-wordmark.svg" alt="Tracetoon" width="128" height="30">
    </a>
    <nav aria-label="Site">
      <a href="./#install">Install</a>
      <a href="./#why" class="opt">Why</a>
      <a href="./#talk" class="opt">Talk</a>
      <a href="prbench.html">Benchmark</a>
      <a href="https://github.com/Tracetoon/tracetoon" class="ext">GitHub<svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5h5v5M9.5 2.5 3 9"/></svg><span class="site-sr"> (leaves this site)</span></a>
    </nav>
  </div>
</header>
<main class="wrap" style="padding-top:2rem;padding-bottom:3rem">
  <p>The results now live on the benchmark page: <a href="prbench.html#results">Tracetoon benchmark results →</a></p>
</main>
</body>
</html>
