name: release

# Tags promote an evaluated artifact set; they never compile a replacement.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read
  # npm trusted publishing and provenance: the registry checks this run's OIDC token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Publishing to npm is on when the repository variable NPM_PUBLISH is set.
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Read the reviewed promotion record
        id: promotion
        run: bun .github/scripts/release-assets.ts metadata release-promotion.json
      - name: Verify the artifact and successful originating CI run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.promotion.outputs.artifactId }}
          ARTIFACT_RUN: ${{ steps.promotion.outputs.runId }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" --jq .conclusion)" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact-metadata.json
          bun .github/scripts/release-assets.ts artifact artifact-metadata.json release-promotion.json
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.promotion.outputs.artifactId }}
          run-id: ${{ steps.promotion.outputs.runId }}
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Verify source identity, release basis and exact evaluated bytes
        run: bun .github/scripts/release-assets.ts verify release release-promotion.json "$GITHUB_REF_NAME"
      - name: Write the recorded release basis
        run: bun .github/scripts/release-assets.ts notes release-promotion.json > release-notes.md
      # Fails before anything is public if the release branch can't take this release.
      - name: Check the plugin bundle can go on the release branch
        run: bun .github/scripts/release-branch.ts release release-promotion.json "$GITHUB_REF_NAME"
      # The npm packages repackage the verified bytes (no compiling); building them here
      # fails before anything is public. They are published last, below.
      - name: Build the npm packages from the verified assets
        run: |
          mkdir "$RUNNER_TEMP/verified-skill"
          unzip -q release/tracetoon-skill.zip -d "$RUNNER_TEMP/verified-skill"
          bun .github/scripts/npm-packages.ts release "$RUNNER_TEMP/verified-skill/tracetoon" "$RUNNER_TEMP/npm" "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/npm-packages.txt"
      - name: Check the plugin packages
        run: bun .github/scripts/plugins-branch.ts "$GITHUB_REF_NAME"
      - name: Publish the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "Tracetoon $GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes $flags
      # Claude Code's marketplace serves plugin/ from `release` (.claude-plugin/marketplace.json).
      # main carries only source; this adds one commit with the verified bundle on top of the tag.
      # Never forced: the previous release head is a parent, so `release` only fast-forwards.
      - name: Publish the plugin bundle on the release branch
        run: bun .github/scripts/release-branch.ts release release-promotion.json "$GITHUB_REF_NAME" --push
      # The OpenAI plugin directory takes a ZIP: the skills-only package (no hooks, no local MCP).
      - name: Attach the OpenAI directory package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd plugins/codex-directory && zip -r -X "$RUNNER_TEMP/tracetoon-codex-directory.zip" .)
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/tracetoon-codex-directory.zip" --clobber
      # npm is optional: without the NPM_PUBLISH variable the release still succeeds.
      - name: Skip npm (no NPM_PUBLISH variable)
        if: env.NPM_PUBLISH == ''
        run: echo "::notice title=npm publish skipped::Set the NPM_PUBLISH repository variable to publish tracetoon and @tracetoon/cli-* to npm (docs/release-channels.md)."
      - uses: actions/setup-node@v4
        if: env.NPM_PUBLISH != ''
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Install npm for trusted publishing
        if: env.NPM_PUBLISH != ''
        run: npm install -g npm@11.12.1
      # Platform packages first, so the wrapper's pinned optionalDependencies exist when it lands.
      # A version already on npm is skipped, so a rerun finishes a partial publish.
      # Authenticates by trusted publishing: npm trades this run's OIDC token for a
      # one-off publish token, so no long-lived secret is needed. NPM_TOKEN is only the
      # bootstrap for the first publish (npm can trust only packages that already exist);
      # delete it once every package trusts this workflow (docs/release-channels.md).
      - name: Publish the npm packages
        if: env.NPM_PUBLISH != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Release candidates go to `next` once a final version is on npm; until then
          # to `latest`, which the install docs use (.github/scripts/npm-dist-tag.ts).
          # npm view fails for a package that doesn't exist yet; the script reads its
          # E404 as "nothing published" and stops the release on any other failure.
          published=$(npm view tracetoon versions --json 2>/dev/null) || true
          dist_tag=$(bun .github/scripts/npm-dist-tag.ts "${GITHUB_REF_NAME#v}" "$published")
          echo "Publishing to the npm dist-tag $dist_tag"
          while read -r dir; do
            spec=$(node -p 'const p = require(process.argv[1] + "/package.json"); p.name + "@" + p.version' "$dir")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
              continue
            fi
            npm publish "$dir" --provenance --access public --tag "$dist_tag"
          done < "$RUNNER_TEMP/npm-packages.txt"

  # Homebrew and winget manifests made from the published checksums; nothing is rebuilt.
  # They are attached to the release; pushing them to a tap or winget-pkgs is a later,
  # owner-run step (docs/release-channels.md).
  channels:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generate the Homebrew formula and winget manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir "$RUNNER_TEMP/published"
          mkdir -p "$RUNNER_TEMP/channels"
          bun .github/scripts/homebrew-formula.ts "$RUNNER_TEMP/published/checksums.txt" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/channels/tracetoon.rb"
          bun .github/scripts/winget-manifest.ts "$RUNNER_TEMP/published/checksums.txt" "$GITHUB_REF_NAME" "$RUNNER_TEMP/winget"
          (cd "$RUNNER_TEMP/winget" && zip -qr "$RUNNER_TEMP/channels/winget-manifests.zip" manifests)
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/channels/tracetoon.rb" "$RUNNER_TEMP/channels/winget-manifests.zip" --clobber

  # The thin plugin packages (plugins/, generated by scripts/plugins.ts) on the `plugins`
  # branch, tagged plugins/<tag>, for the catalogs that review a text-only tree. Every
  # package pins tracetoon@<version>, so this waits until npm serves all of it.
  plugins:
    needs: release
    if: ${{ vars.NPM_PUBLISH != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Wait for the npm packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            missing=""
            # The registry lists a version a few minutes before its tarball downloads
            # (rc.44's 404'd for about 3 minutes), and the plugins pin this exact
            # version, so wait until every tarball answers too.
            for name in tracetoon @tracetoon/cli-linux-x64 @tracetoon/cli-linux-arm64 @tracetoon/cli-darwin-x64 @tracetoon/cli-darwin-arm64 @tracetoon/cli-win32-x64; do
              # npm view exits non-zero on a 404, and under bash -e that would end
              # the step on the first attempt instead of waiting.
              tarball="$(npm view "$name@$version" dist.tarball 2>/dev/null || true)"
              if [ -z "$tarball" ] || ! curl -sfIL -o /dev/null "$tarball"; then
                missing="$missing $name"
              fi
            done
            if [ -z "$missing" ]; then exit 0; fi
            echo "Not on npm yet:$missing (attempt $attempt); waiting 30 s"
            sleep 30
          done
          echo "::error::the $version npm packages did not all appear within 20 minutes"
          exit 1
      - name: Publish the plugin packages
        run: bun .github/scripts/plugins-branch.ts "$GITHUB_REF_NAME" --push

  # Lists the release in the MCP Registry (server.json, generated by scripts/agent-surfaces.ts).
  # Off until the repository variable MCP_REGISTRY_PUBLISH is set: the registry checks that the
  # npm package `tracetoon` of this version exists and names server.json in its `mcpName`.
  mcp-registry:
    needs: release
    if: ${{ vars.MCP_REGISTRY_PUBLISH != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches the tag
        run: |
          version="$(jq -r .version server.json)"
          test "v$version" = "$GITHUB_REF_NAME"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      # The registry checks that tracetoon@<version> is on npm, and npm can take a few
      # minutes to show a version after the release job publishes it.
      - name: Wait for the npm package
        run: |
          version="$(jq -r .version server.json)"
          for attempt in $(seq 1 40); do
            if npm view "tracetoon@$version" version >/dev/null 2>&1; then exit 0; fi
            echo "tracetoon@$version is not on npm yet (attempt $attempt); waiting 30 s"
            sleep 30
          done
          echo "::error::tracetoon@$version did not appear on npm within 20 minutes"
          exit 1
      - name: Publish server.json to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
