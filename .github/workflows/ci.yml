name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each PR on top of main and the PRs ahead of it, so PRs
  # no longer have to be up to date with main before merging.
  merge_group:

# A newer push to the same PR replaces its running CI. Queue and main runs are
# left alone: the queue manages its own, and main keeps a record of every merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # Windows takes about three times as long as the others, so its source
        # tests are split across machines (TRACETOON_TEST_SHARD, balanced by
        # scripts/test-times.baseline.json). Shard 1 also runs the other steps.
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            shard: 1/3
          - os: windows-latest
            shard: 2/3
          - os: windows-latest
            shard: 3/3
    runs-on: ${{ matrix.os }}
    env:
      TRACETOON_TEST_SHARD: ${{ matrix.shard }}
    # A hung step must fail in minutes, not hold a runner for hours (the default is 6h).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Every test makes temporary git repositories, and Windows pays per file and
      # process. The standard runner's D: drive is as fast as a Dev Drive (see
      # astral-sh/uv's setup-dev-drive.ps1); C: holds the default temp folder.
      - name: Keep temporary files on the faster drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'D:\') {
            $tmp = 'D:\tracetoon-tmp'
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            "TMP=$tmp" >> $env:GITHUB_ENV
            "TEMP=$tmp" >> $env:GITHUB_ENV
            Write-Output "Temporary files: $tmp"
          }
          try { Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, AMRunningMode } catch { Write-Output 'Defender status unavailable' }
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify portable candidate archives
        if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        run: python -B -m unittest discover -s .github/scripts -p test_package_candidate.py -v
      - run: bun run typecheck
        if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
      - run: bun run test
      - name: Bundle and run the end-to-end tests against it
        if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        shell: bash
        run: |
          bun run bundle
          bun run build:check
          bun run test:bundled
      - name: Compile and rehearse publication against the executable
        if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        shell: bash
        run: |
          bun run build
          bun run test:compiled

  # The one required check. Its name stays the same however the test matrix
  # changes, and it fails when any test job failed or was cancelled.
  ci-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs passed
        run: test "${{ needs.test.result }}" = success

  candidate-assets:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      artifactId: ${{ steps.candidate.outputs.artifact-id }}
    env:
      TRACETOON_BUILD_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run bundle
      - run: bun run build:check
      - run: bun run build:reproduce
      - name: Build the immutable candidate assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $candidateRecipe = Get-Content build.config.json -Raw | ConvertFrom-Json
          foreach ($candidateTarget in $candidateRecipe.native.targets) {
            $candidateSuffix = if ($candidateTarget.StartsWith('windows-')) { '.exe' } else { '' }
            bun run scripts/build.ts --target "bun-$candidateTarget" --outfile "release/tracetoon-$candidateTarget$candidateSuffix"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package and checksum the candidate
        shell: pwsh
        run: |
          .github/scripts/package-candidate.ps1 -SkillDir plugin/skills/tracetoon -ReleaseDir release
          bun .github/scripts/release-assets.ts inventory release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rehearse the exact candidate bundle and Linux executable
        shell: pwsh
        run: |
          bun run test:bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TRACETOON_TEST_BINARY = (Resolve-Path release/tracetoon-linux-x64).Path
          bun run test:compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        id: candidate
        with:
          name: tracetoon-candidate-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  candidate-windows:
    needs: candidate-assets
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      TRACETOON_BUILD_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run dependencies:prepare
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-assets.outputs.artifactId }}
          path: release
          merge-multiple: true
      - name: Verify and rehearse the exact retained candidate on Windows
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath release/tracetoon-skill.zip -DestinationPath candidate-skill
          bun .github/scripts/release-assets.ts assets release candidate-skill/tracetoon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path candidate-skill/tracetoon/* -Destination plugin/skills/tracetoon -Recurse -Force
          bun run test:bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TRACETOON_TEST_BINARY = (Resolve-Path release/tracetoon-windows-x64.exe).Path
          bun run test:compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
